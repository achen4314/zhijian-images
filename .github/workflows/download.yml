name: Download Paper Images v4
on: [workflow_dispatch, push]
permissions: write-all
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scrape Wikipedia for real image URLs
        run: |
          mkdir -p images && cd images
          
          # Scrape Wikipedia pages to extract actual img src URLs, then download
          download_from_wiki() {
            local wiki_page=$1
            local filename=$2
            local search_pattern=$3
            echo "=== $filename from $wiki_page ==="
            
            # Fetch the Wikipedia page HTML
            curl -s "https://en.wikipedia.org/wiki/${wiki_page}" > page.html
            
            # Extract image URLs matching the search pattern
            grep -oP 'src="[^"]*upload\.wikimedia\.org[^"]*'"${search_pattern}"'[^"]*"' page.html | head -3 > urls.txt
            cat urls.txt | while read line; do echo "  Found: ${line:0:80}..."; done
            
            # Get the first matching URL and download
            local url=$(head -1 urls.txt | sed 's/src="//;s/"//')
            if [ -n "$url" ]; then
              curl -sL --max-time 30 -o "$filename" "$url" && echo "  OK: $(wc -c < $filename)B" || echo "  FAIL"
            else
              echo "  No matching image found"
            fi
          }
          
          # Download each via Wikipedia page scraping
          download_from_wiki "Principia_Mathematica" "principia_1plus1.png" "Principia"
          download_from_wiki "George_Boole" "george_boole.jpg" "George_Boole"
          download_from_wiki "Exclusive_or" "xor_venn.png" "Venn.*XOR\|XOR.*Venn"
          download_from_wiki "Tractatus_Logico-Philosophicus" "tractatus_cover.jpg" "Tractatus"
          download_from_wiki "Artificial_neural_network" "neural_network.png" "Colored.neural\|Artificial.neural"
          download_from_wiki "Boolean_algebra" "boolean_lattice.png" "Boolean"
          download_from_wiki "Square_of_opposition" "square_opposition.png" "Square.*opposition"
          download_from_wiki "Truth_table" "truth_tables.png" "Truth_table"
          download_from_wiki "Hasse_diagram" "huntington_lattice.png" "Hasse.*boolean\|Boolean.*Hasse\|Boolean.*lattice"
          download_from_wiki "Begriffsschrift" "frege_notation.png" "Begriffsschrift\|Frege.*notation\|Frege.*Begriff"
          
          echo "=== Final Results ==="; ls -lh
          for f in *; do
            if [ -s "$f" ]; then
              if file "$f" | grep -qE "PNG|JPEG|image"; then echo "OK: $f ($(wc -c < $f)B)"
              else echo "MAYBE: $f ($(head -c 30 $f))"; fi
            else echo "FAIL: $f (empty)"; fi
          done
      - name: Commit
        run: |
          git config user.name "Bot"; git config user.email "bot@zhijian.ai"
          git add images/; git diff --staged --quiet || (git commit -m "v4: Scrape Wikipedia for images" && git push)
